                    <tr onpointerdown="event.stopPropagation();" onclick="window.miniEmsMoreInfo('binary_sensor.mini_ems_dbc2511007_bien_tan_online', this);"><td>Biến tần online</td><td style="text-align: right;"><span class="val-badge" style="color: ${isOnline ? '#10b981' : '#ef4444'}; background: ${isOnline ? 'rgba(16,185,129,0.15)' : 'rgba(239,68,68,0.15)'};">${isOnline ? 'ON (Online)' : 'OFF'}</span></td></tr>
                    <tr onpointerdown="event.stopPropagation();" onclick="window.miniEmsMoreInfo('binary_sensor.mini_ems_dbc2511007_dang_sac_pin', this);"><td>Đang sạc pin</td><td style="text-align: right;"><span class="val-badge" style="color: ${isBatCharging ? '#34d399' : '#64748b'};">${isBatCharging ? 'ON' : 'OFF'}</span></td></tr>
                    <tr onpointerdown="event.stopPropagation();" onclick="window.miniEmsMoreInfo('binary_sensor.mini_ems_dbc2511007_dang_xa_pin', this);"><td>Đang xả pin</td><td style="text-align: right;"><span class="val-badge" style="color: ${isBatDischarging ? '#fbbf24' : '#64748b'};">${isBatDischarging ? 'ON' : 'OFF'}</span></td></tr>
                    <tr onpointerdown="event.stopPropagation();" onclick="window.miniEmsMoreInfo('binary_sensor.mini_ems_dbc2511007_mat_troi_dang_phat_dien', this);"><td>Mặt trời đang phát điện</td><td style="text-align: right;"><span class="val-badge" style="color: ${isSolarGen ? '#fbbf24' : '#64748b'};">${isSolarGen ? 'ON' : 'OFF'}</span></td></tr>
                    <tr onpointerdown="event.stopPropagation();" onclick="window.miniEmsMoreInfo('binary_sensor.mini_ems_dbc2511007_dang_mua_dien_luoi', this);"><td>Đang mua điện lưới</td><td style="text-align: right;"><span class="val-badge" style="color: ${isGridImport ? '#f59e0b' : '#64748b'};">${isGridImport ? 'ON' : 'OFF'}</span></td></tr>
                    <tr onpointerdown="event.stopPropagation();" onclick="window.miniEmsMoreInfo('binary_sensor.mini_ems_dbc2511007_dang_ban_dien_luoi_hoa_luoi', this);"><td>Đang bán điện lưới</td><td style="text-align: right;"><span class="val-badge" style="color: ${isGridExport ? '#10b981' : '#64748b'};">${isGridExport ? 'ON' : 'OFF'}</span></td></tr>
                    <tr onpointerdown="event.stopPropagation();" onclick="window.miniEmsMoreInfo('binary_sensor.mini_ems_dbc2511007_co_ban_cap_nhat_firmware', this);"><td>Có bản cập nhật firmware</td><td style="text-align: right;"><span class="val-badge" style="color: ${hasFwUpdate ? '#f87171' : '#64748b'};">${hasFwUpdate ? 'CÓ' : 'KHÔNG'}</span></td></tr>
                  </table>

                  <!-- Điều khiển cấu hình -->
                  <div style="font-size: 11px; font-weight: 800; color: #06b6d4; margin-bottom: 6px; display: flex; align-items: center; gap: 6px;">
                    <ha-icon icon="mdi:cog" style="color: #06b6d4; --mdc-icon-size: 16px;"></ha-icon>
                    <span>6. THỰC THỂ ĐIỀU KHIỂN & CÀI ĐẶT (9 THỰC THỂ)</span>
                  </div>
                  <table class="entity-table">
                    <tr onpointerdown="event.stopPropagation();" onclick="window.miniEmsMoreInfo('switch.mini_ems_dbc2511007_cho_phep_ban_dien_luoi_grid_export', this);"><td>Cho phép bán điện lưới</td><td style="text-align: right;"><b style="color: ${gridExportState ? '#10b981' : '#64748b'};">${gridExportState ? 'BẬT (ON)' : 'TẮT (OFF)'}</b></td></tr>
                    <tr onpointerdown="event.stopPropagation();" onclick="window.miniEmsMoreInfo('switch.mini_ems_dbc2511007_buoc_sac_pin_tu_luoi_force_charge', this);"><td>Buộc sạc pin từ lưới</td><td style="text-align: right;"><b style="color: ${forceChargeState ? '#fbbf24' : '#64748b'};">${forceChargeState ? 'BẬT (ON)' : 'TẮT (OFF)'}</b></td></tr>
                    <tr onpointerdown="event.stopPropagation();" onclick="window.miniEmsMoreInfo('select.mini_ems_dbc2511007_che_do_hoat_dong_work_mode', this);"><td>Chế độ hoạt động</td><td style="text-align: right;"><b style="color: #38bdf8;">${workModeVal}</b></td></tr>
                    <tr onpointerdown="event.stopPropagation();" onclick="window.miniEmsMoreInfo('select.mini_ems_dbc2511007_che_do_sac_pin_charge_mode', this);"><td>Chế độ sạc pin</td><td style="text-align: right;"><b style="color: #34d399;">${chargeModeVal}</b></td></tr>
                    <tr onpointerdown="event.stopPropagation();" onclick="window.miniEmsMoreInfo('number.mini_ems_dbc2511007_gioi_han_cong_suat_phat_luoi_max_export_power', this);"><td>Giới hạn phát lưới</td><td style="text-align: right;"><b style="color: #38bdf8;">${maxExportW} W</b></td></tr>
                    <tr onpointerdown="event.stopPropagation();" onclick="window.miniEmsMoreInfo('number.mini_ems_dbc2511007_dong_sac_pin_toi_da_max_charge_current', this);"><td>Dòng sạc pin tối đa</td><td style="text-align: right;"><b style="color: #34d399;">${maxChargeA} A</b></td></tr>
                    <tr onpointerdown="event.stopPropagation();" onclick="window.miniEmsMoreInfo('number.mini_ems_dbc2511007_dong_xa_pin_toi_da_max_discharge_current', this);"><td>Dòng xả pin tối đa</td><td style="text-align: right;"><b style="color: #fbbf24;">${maxDischargeA} A</b></td></tr>
                    <tr onpointerdown="event.stopPropagation();" onclick="window.miniEmsMoreInfo('number.mini_ems_dbc2511007_pin_soc_toi_thieu_min_battery_soc', this);"><td>Pin SOC tối thiểu</td><td style="text-align: right;"><b style="color: #f43f5e;">${minSocVal} %</b></td></tr>
                    <tr onpointerdown="event.stopPropagation();" onclick="window.miniEmsMoreInfo('number.mini_ems_dbc2511007_pin_soc_toi_da_max_battery_soc', this);"><td>Pin SOC tối đa</td><td style="text-align: right;"><b style="color: #10b981;">${maxSocVal} %</b></td></tr>
                  </table>
                </div>

              </div>
            </div>

          </div>
        `;
      } catch (e) {
        return `<div style="padding: 16px; color: #f87171;">Lỗi tải dữ liệu: ` + e.message + `</div>`;
      }
    ]]]
