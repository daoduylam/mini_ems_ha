                    <div style="font-size: 9px; color: #94a3b8;">ĐIỆN ÁP LƯỚI</div>
                    <div style="font-size: 13px; font-weight: 800; color: #fff;">${grid_v} V</div>
                  </div>
                  <div style="background: rgba(255,255,255,0.03); border-radius: 8px; padding: 6px;">
                    <div style="font-size: 9px; color: #94a3b8;">DÒNG LƯỚI</div>
                    <div style="font-size: 13px; font-weight: 800; color: #38bdf8;">${grid_curr} A</div>
                  </div>
                  <div style="background: rgba(255,255,255,0.03); border-radius: 8px; padding: 6px;">
                    <div style="font-size: 9px; color: #94a3b8;">TẦN SỐ LƯỚI</div>
                    <div style="font-size: 13px; font-weight: 800; color: #fff;">${grid_hz} Hz</div>
                  </div>
                </div>
                <div style="background: rgba(255,255,255,0.03); border-radius: 8px; padding: 6px 10px; display: grid; grid-template-columns: 1fr 1fr 1fr; text-align: center; font-size: 11px;">
                  <div><span style="color: #94a3b8; font-size: 9.5px;">Dòng AC</span><br><b style="color: #fff;">${inv_curr} A</b></div>
                  <div><span style="color: #94a3b8; font-size: 9.5px;">Biến tần</span><br><b style="color: #38bdf8;">${inv_power} W</b></div>
                  <div><span style="color: #94a3b8; font-size: 9.5px;">Nhiệt độ BT</span><br><b style="color: #34d399;">${inv_temp}°C</b></div>
                </div>
              </div>

              <!-- Pin lưu trữ -->
              <div class="glass-panel" style="border-top: 3px solid #34d399;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                  <span style="font-size: 12px; font-weight: 800; color: #fff;">PIN LƯU TRỮ BMS</span>
                  <span style="font-size: 12px; font-weight: 900; color: #34d399; background: rgba(52,211,153,0.15); padding: 2px 6px; border-radius: 6px;">
                    ${bat_soc}%
                  </span>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; text-align: center; margin-bottom: 8px;">
                  <div style="background: rgba(255,255,255,0.03); border-radius: 6px; padding: 6px 2px;">
                    <div style="font-size: 9px; color: #94a3b8;">ĐIỆN ÁP</div>
                    <div style="font-size: 13px; font-weight: 800; color: #fff;">${bat_v} V</div>
                  </div>
                  <div style="background: rgba(255,255,255,0.03); border-radius: 6px; padding: 6px 2px;">
                    <div style="font-size: 9px; color: #94a3b8;">DÒNG</div>
                    <div style="font-size: 13px; font-weight: 800; color: ${batTextColor};">${bat_a} A</div>
                  </div>
                  <div style="background: rgba(255,255,255,0.03); border-radius: 6px; padding: 6px 2px;">
                    <div style="font-size: 9px; color: #94a3b8;">CÔNG SUẤT</div>
                    <div style="font-size: 13px; font-weight: 800; color: ${batTextColor};">${displayBatW} W</div>
                  </div>
                </div>
                <div style="background: rgba(0,0,0,0.3); border-radius: 8px; padding: 6px 10px; margin-bottom: 6px;">
                  <div style="display: flex; justify-content: space-between; font-size: 10.5px; margin-bottom: 4px;">
                    <span style="color: #94a3b8;">Dung lượng:</span>
                    <span><b style="color: #34d399;">${bat_remain_kwh} kWh</b> / ${bat_total_kwh} kWh</span>
                  </div>
                  <div style="width: 100%; height: 5px; border-radius: 3px; background: rgba(255,255,255,0.1); overflow: hidden;">
                    <div style="width: ${bat_soc}%; background: linear-gradient(90deg, #10b981, #34d399); height: 100%;"></div>
                  </div>
                </div>
                <div style="display: flex; justify-content: space-between; font-size: 10px; color: #94a3b8; padding: 0 4px;">
                  <span>Độ lệch: <b style="color: #38bdf8;">${bat_delta} V</b></span>
                  <span>Chu kỳ: <b style="color: #fff;">${bat_cycles}</b></span>
                  <span>Nhiệt độ: <b style="color: #34d399;">${bat_temp}°C</b></span>
                </div>
              </div>
            </div>

            <!-- ======================================================== -->
            <!-- BẢNG ĐIỀU KHIỂN TẬP TRUNG (INTERACTIVE REMOTE CONTROLS)    -->
            <!-- ======================================================== -->
            <div class="glass-panel" style="border-top: 3px solid #06b6d4; padding: 14px; margin-bottom: 14px;">
              <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                <div style="display: flex; align-items: center; gap: 8px;">
                  <ha-icon icon="mdi:tune-vertical" style="color: #06b6d4; --mdc-icon-size: 20px;"></ha-icon>
                  <div>
                    <span style="font-size: 13px; font-weight: 900; color: #fff; text-transform: uppercase; letter-spacing: 0.5px;">BẢNG ĐIỀU KHIỂN TẬP TRUNG (REMOTE CONTROLS)</span>
                    <div style="font-size: 10px; color: #94a3b8;">Chạm trực tiếp để đổi chế độ, bật/tắt công tắc và chỉnh tham số</div>
                  </div>
                </div>
                <span style="font-size: 10px; color: #06b6d4; font-weight: 800; background: rgba(6,182,212,0.15); padding: 3px 8px; border-radius: 6px;">Live 2-Way</span>
              </div>

              <!-- HÀNG 1: CÔNG TẮC BẬT TẮT NHANH -->
              <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; margin-bottom: 12px;">
                <!-- Công tắc 1: Cho phép bán điện -->
                <div onpointerdown="event.stopPropagation();" onclick="event.stopPropagation(); window.miniEmsToggle('switch.mini_ems_dbc2511007_cho_phep_ban_dien_luoi_grid_export', this);"
                     style="background: rgba(255,255,255,0.04); border: 1px solid ${gridExportState ? 'rgba(16,185,129,0.45)' : 'rgba(255,255,255,0.08)'}; border-radius: 12px; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: all 0.2s;"
                     title="Chạm để BẬT / TẮT bán điện lên lưới EVN">
                  <div style="display: flex; align-items: center; gap: 10px;">
                    <ha-icon icon="mdi:transmission-tower-export" style="color: ${gridExportState ? '#10b981' : '#64748b'}; --mdc-icon-size: 22px;"></ha-icon>
                    <div>
                      <div style="font-size: 12px; font-weight: 800; color: #fff;">Bán điện lưới (Grid Export)</div>
                      <div style="font-size: 10px; color: ${gridExportState ? '#10b981' : '#94a3b8'}; font-weight: 700;">${gridExportState ? 'Đang BẬT (Chạm để tắt)' : 'Đang TẮT (Chạm để bật)'}</div>
                    </div>
                  </div>
                  <div style="width: 46px; height: 26px; border-radius: 13px; background: ${gridExportState ? '#10b981' : 'rgba(255,255,255,0.18)'}; position: relative; transition: background 0.2s;">
                    <div style="width: 20px; height: 20px; border-radius: 50%; background: #fff; position: absolute; top: 3px; left: ${gridExportState ? '23px' : '3px'}; transition: left 0.2s; box-shadow: 0 1px 4px rgba(0,0,0,0.5);"></div>
                  </div>
                </div>

                <!-- Công tắc 2: Buộc sạc lưới -->
                <div onpointerdown="event.stopPropagation();" onclick="event.stopPropagation(); window.miniEmsToggle('switch.mini_ems_dbc2511007_buoc_sac_pin_tu_luoi_force_charge', this);"
                     style="background: rgba(255,255,255,0.04); border: 1px solid ${forceChargeState ? 'rgba(245,158,11,0.45)' : 'rgba(255,255,255,0.08)'}; border-radius: 12px; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: all 0.2s;"
                     title="Chạm để BẬT / TẮT buộc sạc pin từ lưới EVN">
                  <div style="display: flex; align-items: center; gap: 10px;">
                    <ha-icon icon="mdi:battery-charging-high" style="color: ${forceChargeState ? '#fbbf24' : '#64748b'}; --mdc-icon-size: 22px;"></ha-icon>
                    <div>
                      <div style="font-size: 12px; font-weight: 800; color: #fff;">Buộc sạc lưới (Force Charge)</div>
                      <div style="font-size: 10px; color: ${forceChargeState ? '#fbbf24' : '#94a3b8'}; font-weight: 700;">${forceChargeState ? 'Đang BẬT (Chạm để tắt)' : 'Đang TẮT (Chạm để bật)'}</div>
                    </div>
                  </div>
                  <div style="width: 46px; height: 26px; border-radius: 13px; background: ${forceChargeState ? '#f59e0b' : 'rgba(255,255,255,0.18)'}; position: relative; transition: background 0.2s;">
                    <div style="width: 20px; height: 20px; border-radius: 50%; background: #fff; position: absolute; top: 3px; left: ${forceChargeState ? '23px' : '3px'}; transition: left 0.2s; box-shadow: 0 1px 4px rgba(0,0,0,0.5);"></div>
                  </div>
                </div>
              </div>

              <!-- HÀNG 2: CHỌN CHẾ ĐỘ HOẠT ĐỘNG (WORK MODE PILL BUTTONS) -->
              <div style="background: rgba(255,255,255,0.03); border: 1px solid rgba(56,189,248,0.2); border-radius: 12px; padding: 10px 12px; margin-bottom: 10px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                  <div style="display: flex; align-items: center; gap: 6px;">
                    <ha-icon icon="mdi:tune" style="color: #38bdf8; --mdc-icon-size: 16px;"></ha-icon>
                    <span style="font-size: 11px; font-weight: 800; color: #fff;">CHẾ ĐỘ HOẠT ĐỘNG (WORK MODE)</span>
                  </div>
                  <span style="font-size: 10.5px; font-weight: 800; color: #38bdf8;">Hiện tại: ${workModeVal}</span>
                </div>
                <div style="display: flex; flex-wrap: wrap; gap: 6px;">
                  <div class="mode-pill ${workModeVal.indexOf('Tự dùng') !== -1 || workModeVal.indexOf('Self') !== -1 ? 'active-blue' : ''}"
                       onpointerdown="event.stopPropagation();"
                       onclick="event.stopPropagation(); window.miniEmsSetSelect('select.mini_ems_dbc2511007_che_do_hoat_dong_work_mode', 'Tự dùng (Self-Consumption)', this);">
                    🔄 Tự dùng
                  </div>
                  <div class="mode-pill ${workModeVal.indexOf('Mặt trời') !== -1 || workModeVal.indexOf('Solar') !== -1 ? 'active-blue' : ''}"
                       onpointerdown="event.stopPropagation();"
                       onclick="event.stopPropagation(); window.miniEmsSetSelect('select.mini_ems_dbc2511007_che_do_hoat_dong_work_mode', 'Mặt trời ưu tiên (Solar First)', this);">
                    ☀ Mặt trời ưu tiên
                  </div>
                  <div class="mode-pill ${workModeVal.indexOf('Pin') !== -1 || workModeVal.indexOf('Battery') !== -1 ? 'active-blue' : ''}"
                       onpointerdown="event.stopPropagation();"
                       onclick="event.stopPropagation(); window.miniEmsSetSelect('select.mini_ems_dbc2511007_che_do_hoat_dong_work_mode', 'Pin ưu tiên (Battery First)', this);">
                    🔋 Pin ưu tiên
                  </div>
                  <div class="mode-pill ${workModeVal.indexOf('Lưới') !== -1 || workModeVal.indexOf('Grid') !== -1 ? 'active-blue' : ''}"
                       onpointerdown="event.stopPropagation();"
                       onclick="event.stopPropagation(); window.miniEmsSetSelect('select.mini_ems_dbc2511007_che_do_hoat_dong_work_mode', 'Lưới ưu tiên (Grid First)', this);">
                    ⚡ Lưới ưu tiên
                  </div>
                </div>
              </div>

              <!-- HÀNG 3: CHỌN CHẾ ĐỘ SẠC PIN (CHARGE MODE PILL BUTTONS) -->
              <div style="background: rgba(255,255,255,0.03); border: 1px solid rgba(52,211,153,0.2); border-radius: 12px; padding: 10px 12px; margin-bottom: 12px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                  <div style="display: flex; align-items: center; gap: 6px;">
                    <ha-icon icon="mdi:battery-charging-outline" style="color: #34d399; --mdc-icon-size: 16px;"></ha-icon>
                    <span style="font-size: 11px; font-weight: 800; color: #fff;">CHẾ ĐỘ SẠC PIN (CHARGE MODE)</span>
                  </div>
                  <span style="font-size: 10.5px; font-weight: 800; color: #34d399;">Hiện tại: ${chargeModeVal}</span>
                </div>
                <div style="display: flex; flex-wrap: wrap; gap: 6px;">
                  <div class="mode-pill ${chargeModeVal.indexOf('Tự động') !== -1 || chargeModeVal.indexOf('Auto') !== -1 ? 'active-green' : ''}"
                       onpointerdown="event.stopPropagation();"
                       onclick="event.stopPropagation(); window.miniEmsSetSelect('select.mini_ems_dbc2511007_che_do_sac_pin_charge_mode', 'Tự động (Auto)', this);">
                    🤖 Tự động (Auto)
                  </div>
                  <div class="mode-pill ${chargeModeVal.indexOf('Chỉ') !== -1 || chargeModeVal.indexOf('Solar Only') !== -1 ? 'active-green' : ''}"
                       onpointerdown="event.stopPropagation();"
                       onclick="event.stopPropagation(); window.miniEmsSetSelect('select.mini_ems_dbc2511007_che_do_sac_pin_charge_mode', 'Chỉ mặt trời (Solar Only)', this);">
                    ☀ Chỉ sạc mặt trời
                  </div>
                  <div class="mode-pill ${chargeModeVal.indexOf('Grid') !== -1 || chargeModeVal.indexOf('Lưới') !== -1 ? 'active-green' : ''}"
                       onpointerdown="event.stopPropagation();"
                       onclick="event.stopPropagation(); window.miniEmsSetSelect('select.mini_ems_dbc2511007_che_do_sac_pin_charge_mode', 'Mặt trời + Lưới (Solar + Grid)', this);">
                    ⚡ Mặt trời + Lưới
                  </div>
                </div>
              </div>

              <!-- HÀNG 4: 5 THANH CHỈNH THAM SỐ SỐ HỌC (STEPPERS) -->
