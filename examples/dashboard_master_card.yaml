# ==============================================================================
# BẢNG ĐIỀU KHIỂN ĐIỆN MẶT TRỜI HYBRID MINI-EMS / DONNERGY (MASTER CARD)
# Thiết kế chuẩn 100% theo ID thực thể chính thức của bộ tích hợp Mini EMS
# Serial: DBC2511007
# HIỂN THỊ ĐẦY ĐỦ TRỰC TIẾP TOÀN BỘ 50 THỰC THỂ (KHÔNG ẨN / KHÔNG THU GỌN)
# ĐIỀU KHIỂN 2 CHIỀU TRỰC TIẾP DẠNG NÚT BẤM CẢM ỨNG CHUYÊN NGHIỆP
# ==============================================================================

type: custom:button-card
entity: sensor.mini_ems_dbc2511007_ac_cong_suat_dau_ra_ac_output_power
show_name: false
show_icon: false
tap_action:
  action: none
hold_action:
  action: none
double_tap_action:
  action: none
triggers_update:
  # Toàn bộ 50 thực thể Mini EMS
  - sensor.mini_ems_dbc2511007_tong_cong_suat_pv_pv_total_power
  - sensor.mini_ems_dbc2511007_pv1_power
  - sensor.mini_ems_dbc2511007_pv2_power
  - sensor.mini_ems_dbc2511007_pv1_dien_ap_pv1_voltage
  - sensor.mini_ems_dbc2511007_pv2_dien_ap_pv2_voltage
  - sensor.mini_ems_dbc2511007_ac_cong_suat_dau_ra_ac_output_power
  - sensor.mini_ems_dbc2511007_ac_dong_dien_dau_ra_ac_current
  - sensor.mini_ems_dbc2511007_bien_tan_cong_suat_inverter_power
  - sensor.mini_ems_dbc2511007_cong_suat_dinh_muc_rated_power
  - sensor.mini_ems_dbc2511007_cong_suat_hien_tai_current_power
  - sensor.mini_ems_dbc2511007_tai_tieu_thu_load_power
  - sensor.mini_ems_dbc2511007_nhiet_do_bien_tan_inverter_temp
  - sensor.mini_ems_dbc2511007_trang_thai_he_thong_system_status
  - sensor.mini_ems_dbc2511007_ty_le_tu_tieu_thu_self_consumption
  - sensor.mini_ems_dbc2511007_so_luong_bien_tan
  - sensor.mini_ems_dbc2511007_bien_tan_dang_online
  - sensor.mini_ems_dbc2511007_dien_ap_luoi_grid_voltage
  - sensor.mini_ems_dbc2511007_tan_so_luoi_grid_frequency
  - sensor.mini_ems_dbc2511007_dong_dien_luoi_grid_current
  - sensor.mini_ems_dbc2511007_luoi_cong_suat_grid_power_mua_ban
  - sensor.mini_ems_dbc2511007_pin_soc_battery_soc
  - sensor.mini_ems_dbc2511007_pin_dien_ap_battery_voltage
  - sensor.mini_ems_dbc2511007_pin_dong_dien_battery_current_sac_xa
  - sensor.mini_ems_dbc2511007_pin_cong_suat_battery_power_sac_xa
  - sensor.mini_ems_dbc2511007_nhiet_do_pin_battery_temp
  - sensor.mini_ems_dbc2511007_san_luong_hom_nay_daily_generation
  - sensor.mini_ems_dbc2511007_tong_san_luong_total_generation
  - sensor.mini_ems_dbc2511007_san_luong_hom_nay_bien_tan_daily_kwh
  - sensor.mini_ems_dbc2511007_tong_san_luong_bien_tan_total_kwh
  - sensor.mini_ems_dbc2511007_thu_nhap_hom_nay_daily_income
  - sensor.mini_ems_dbc2511007_tong_thu_nhap_cumulative_income
  - sensor.mini_ems_dbc2511007_than_tieu_chuan_tiet_kiem_save_coal
  - sensor.mini_ems_dbc2511007_giam_phat_thai_co2
  - sensor.mini_ems_dbc2511007_cay_xanh_bao_ve
  - binary_sensor.mini_ems_dbc2511007_bien_tan_online
  - binary_sensor.mini_ems_dbc2511007_dang_sac_pin
  - binary_sensor.mini_ems_dbc2511007_dang_xa_pin
  - binary_sensor.mini_ems_dbc2511007_mat_troi_dang_phat_dien
  - binary_sensor.mini_ems_dbc2511007_dang_mua_dien_luoi
  - binary_sensor.mini_ems_dbc2511007_dang_ban_dien_luoi_hoa_luoi
  - binary_sensor.mini_ems_dbc2511007_co_ban_cap_nhat_firmware
  - switch.mini_ems_dbc2511007_cho_phep_ban_dien_luoi_grid_export
  - switch.mini_ems_dbc2511007_buoc_sac_pin_tu_luoi_force_charge
  - select.mini_ems_dbc2511007_che_do_hoat_dong_work_mode
  - select.mini_ems_dbc2511007_che_do_sac_pin_charge_mode
  - number.mini_ems_dbc2511007_gioi_han_cong_suat_phat_luoi_max_export_power
  - number.mini_ems_dbc2511007_dong_sac_pin_toi_da_max_charge_current
  - number.mini_ems_dbc2511007_dong_xa_pin_toi_da_max_discharge_current
  - number.mini_ems_dbc2511007_pin_soc_toi_thieu_min_battery_soc
  - number.mini_ems_dbc2511007_pin_soc_toi_da_max_battery_soc
  - sensor.phong_bep_pin_luu_tru_delta_cell_voltage
  - sensor.phong_bep_pin_luu_tru_cycles
  - sensor.phong_bep_pin_luu_tru_stored_energy
  - sun.sun
  - weather.forecast_home
  - weather.home
styles:
  card:
    - background: linear-gradient(135deg, rgba(8, 14, 26, 0.96) 0%, rgba(4, 8, 16, 0.98) 100%)
    - backdrop-filter: blur(20px)
    - -webkit-backdrop-filter: blur(20px)
    - border: 1px solid rgba(255, 255, 255, 0.08)
    - border-radius: 24px
    - box-shadow: 0 25px 60px -10px rgba(0, 0, 0, 0.85)
    - width: 100%
    - padding: 12px 10px 24px 10px
    - box-sizing: border-box
    - color: '#fff'
    - pointer-events: auto
    - cursor: default
  custom_fields:
    master_dashboard:
      - pointer-events: auto
      - width: 100%
custom_fields:
  master_dashboard: |
    [[[
      try {
        if (typeof hass !== 'undefined' && hass) {
          window.__ha_hass = hass;
        }

        // ==========================================
        // 0. HÀM ĐỌC GIÁ TRỊ AN TOÀN
        // ==========================================
        function getNum(entityId, defVal = 0) {
          if (!states[entityId] || states[entityId].state === 'unavailable' || states[entityId].state === 'unknown') {
            return defVal;
          }
          var val = parseFloat(states[entityId].state);
          return isNaN(val) ? defVal : val;
        }

        function getFirstValid(entityList, defVal = 0) {
          for (var i = 0; i < entityList.length; i++) {
            var id = entityList[i];
            if (states[id] && states[id].state !== 'unavailable' && states[id].state !== 'unknown') {
              var v = parseFloat(states[id].state);
              if (!isNaN(v) && v > 0) return v;
            }
          }
          for (var i = 0; i < entityList.length; i++) {
            var id = entityList[i];
            if (states[id] && states[id].state !== 'unavailable' && states[id].state !== 'unknown') {
              var v = parseFloat(states[id].state);
              if (!isNaN(v)) return v;
            }
          }
          return defVal;
        }

        function getStr(entityId, defVal = "") {
          if (!states[entityId] || states[entityId].state === 'unavailable' || states[entityId].state === 'unknown') {
            return defVal;
          }
          return states[entityId].state;
        }

        function formatVND(n) {
          return Math.round(n || 0).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
        }

        // ==========================================
        // HÀM ĐIỀU KHIỂN TƯƠNG TÁC (CONTROL ACTIONS)
        // ==========================================
        function getHassInstance() {
          if (window.__ha_hass) return window.__ha_hass;
          var ha = document.querySelector('home-assistant');
          if (ha && ha.hass) return ha.hass;
          try {
            var root = ha ? ha.shadowRoot : null;
            var main = root ? root.querySelector('home-assistant-main') : null;
            if (main && main.hass) return main.hass;
            var panel = main && main.shadowRoot ? main.shadowRoot.querySelector('ha-panel-lovelace') : null;
            if (panel && panel.hass) return panel.hass;
          } catch(e) {}
          return null;
        }

        window.miniEmsCall = function(domain, service, serviceData, elem) {
          var h = getHassInstance();
          if (h && h.callService) {
            h.callService(domain, service, serviceData);
            return;
          }
          var ev = new CustomEvent('hass-action', {
            bubbles: true,
            composed: true,
            detail: {
              config: {
                tap_action: {
                  action: 'call-service',
                  service: domain + '.' + service,
                  data: serviceData
                }
              },
              action: 'tap'
            }
          });
          if (elem) elem.dispatchEvent(ev);
          else if (document.querySelector('home-assistant')) document.querySelector('home-assistant').dispatchEvent(ev);
        };

        window.miniEmsMoreInfo = function(entityId, elem) {
          var ev = new CustomEvent('hass-more-info', {
            bubbles: true,
            composed: true,
            detail: { entityId: entityId }
          });
          if (elem) elem.dispatchEvent(ev);
          else if (document.querySelector('home-assistant')) document.querySelector('home-assistant').dispatchEvent(ev);
          window.dispatchEvent(ev);
        };

        window.miniEmsToggle = function(entityId, elem) {
          window.miniEmsCall('homeassistant', 'toggle', { entity_id: entityId }, elem);
        };

        window.miniEmsSetSelect = function(entityId, option, elem) {
          window.miniEmsCall('select', 'select_option', { entity_id: entityId, option: option }, elem);
        };

        window.miniEmsSetNumber = function(entityId, val, elem) {
          window.miniEmsCall('number', 'set_value', { entity_id: entityId, value: parseFloat(val) }, elem);
        };

        window.miniEmsStepNumber = function(entityId, currentVal, step, minVal, maxVal, elem) {
          var nextVal = Math.min(maxVal, Math.max(minVal, Math.round(parseFloat(currentVal) + step)));
          window.miniEmsSetNumber(entityId, nextVal, elem);
        };

        // ==========================================
        // 1. THỜI TIẾT & BỨC XẠ
        // ==========================================
        var sunObj = states['sun.sun'];
        var sunElev = sunObj && sunObj.attributes ? Math.round(sunObj.attributes.elevation || 0) : 0;
        var sunIsAbove = sunObj ? (sunObj.state === 'above_horizon') : true;

        var sunriseTime = "05:50";
        var sunsetTime = "17:45";
        if (sunObj && sunObj.attributes) {
          if (sunObj.attributes.next_rising) {
            var rD = new Date(sunObj.attributes.next_rising);
            sunriseTime = ("0" + rD.getHours()).slice(-2) + ":" + ("0" + rD.getMinutes()).slice(-2);
          }
          if (sunObj.attributes.next_setting) {
            var sD = new Date(sunObj.attributes.next_setting);
            sunsetTime = ("0" + sD.getHours()).slice(-2) + ":" + ("0" + sD.getMinutes()).slice(-2);
          }
        }

        var weatherObj = states['weather.forecast_home'] || states['weather.home'] || null;
        if (!weatherObj) {
          for (var wKey in states) {
            if (wKey.startsWith('weather.')) {
              weatherObj = states[wKey];
              break;
            }
          }
        }

        var weatherState = weatherObj ? weatherObj.state : 'sunny';
        var rawTemp = weatherObj && weatherObj.attributes && weatherObj.attributes.temperature !== undefined ? parseFloat(weatherObj.attributes.temperature) : 28;
        var tempUnit = (weatherObj && weatherObj.attributes && weatherObj.attributes.temperature_unit) || '°C';
        var weatherTemp = Math.round(rawTemp);
        if (tempUnit.includes('F') || rawTemp > 55) {
          weatherTemp = Math.round((rawTemp - 32) * 5 / 9);
        }
        var weatherHumi = weatherObj && weatherObj.attributes && weatherObj.attributes.humidity ? Math.round(weatherObj.attributes.humidity) : 65;
        var weatherWind = weatherObj && weatherObj.attributes && weatherObj.attributes.wind_speed ? Math.round(weatherObj.attributes.wind_speed) : 8;

        var isNight = (!sunIsAbove || sunElev <= 0);
        var weatherDesc = isNight ? 'Đêm quang mây' : 'Trời nắng';
        var weatherIcon = isNight ? 'mdi:weather-night' : 'mdi:weather-sunny';
        var weatherIconColor = isNight ? '#38bdf8' : '#fbbf24';

        if (weatherState === 'sunny' || weatherState === 'clear-night') {
          weatherDesc = isNight ? 'Đêm quang mây' : 'Trời nắng';
          weatherIcon = isNight ? 'mdi:weather-night' : 'mdi:weather-sunny';
          weatherIconColor = isNight ? '#38bdf8' : '#fbbf24';
        } else if (weatherState === 'partlycloudy') {
          weatherDesc = isNight ? 'Đêm có mây' : 'Nắng có mây';
          weatherIcon = isNight ? 'mdi:weather-night-partly-cloudy' : 'mdi:weather-partly-cloudy';
          weatherIconColor = isNight ? '#93c5fd' : '#fbbf24';
        } else if (weatherState === 'cloudy' || weatherState === 'overcast') {
          weatherDesc = isNight ? 'Đêm nhiều mây' : 'Nhiều mây';
          weatherIcon = 'mdi:weather-cloudy';
          weatherIconColor = '#94a3b8';
        } else if (weatherState === 'rainy' || weatherState === 'pouring') {
          weatherDesc = weatherState === 'pouring' ? 'Mưa to' : 'Có mưa';
          weatherIcon = 'mdi:weather-rainy';
          weatherIconColor = '#38bdf8';
        }

        var solarEval = isNight ? "Mặt trời đã lặn" : (sunElev < 20 ? "Nắng xiên thấp" : "Bức xạ cao");
        var solarEvalColor = isNight ? "#94a3b8" : (sunElev < 20 ? "#fbbf24" : "#34d399");

        // ==========================================
        // 2. DỮ LIỆU ĐO ĐẠC TOÀN BỘ 50 THỰC THỂ
        // ==========================================
        // PV1 & PV2
        var pv1_v = Math.round(getNum('sensor.mini_ems_dbc2511007_pv1_dien_ap_pv1_voltage', 0));
        var pv2_v = Math.round(getNum('sensor.mini_ems_dbc2511007_pv2_dien_ap_pv2_voltage', 0));
        var pv1_w = Math.round(getNum('sensor.mini_ems_dbc2511007_pv1_power', 0));
        var pv2_w = Math.round(getNum('sensor.mini_ems_dbc2511007_pv2_power', 0));
        var pvTotal = Math.round(getNum('sensor.mini_ems_dbc2511007_tong_cong_suat_pv_pv_total_power', 0));
        if (pvTotal <= 0) pvTotal = pv1_w + pv2_w;
        if (isNight) { pv1_w = 0; pv2_w = 0; pvTotal = 0; }
        var pv1_a = pv1_v > 10 ? (pv1_w / pv1_v).toFixed(1) : "0.0";
        var pv2_a = pv2_v > 10 ? (pv2_w / pv2_v).toFixed(1) : "0.0";

        // Pin Lithium BMS
        var bat_soc = Math.round(getNum('sensor.mini_ems_dbc2511007_pin_soc_battery_soc', 70));
        var bat_v = getNum('sensor.mini_ems_dbc2511007_pin_dien_ap_battery_voltage', 52.8).toFixed(1);
        var bat_a = getNum('sensor.mini_ems_dbc2511007_pin_dong_dien_battery_current_sac_xa', 0).toFixed(1);
        var bat_w = Math.round(getNum('sensor.mini_ems_dbc2511007_pin_cong_suat_battery_power_sac_xa', 0));
        var bat_temp = Math.round(getNum('sensor.mini_ems_dbc2511007_nhiet_do_pin_battery_temp', 25));
        var bat_cycles = getStr('sensor.phong_bep_pin_luu_tru_cycles', '131');
        var bat_delta = getStr('sensor.phong_bep_pin_luu_tru_delta_cell_voltage', '0.004');
        var bat_energy_wh = getNum('sensor.phong_bep_pin_luu_tru_stored_energy', Math.round(10200 * (bat_soc / 100)));
        var bat_remain_kwh = (bat_energy_wh / 1000).toFixed(1);
        var bat_total_kwh = 10.2;

        // Biến tần & Lưới điện
        var inv_temp = Math.round(getNum('sensor.mini_ems_dbc2511007_nhiet_do_bien_tan_inverter_temp', 25));
        var inv_curr = getNum('sensor.mini_ems_dbc2511007_ac_dong_dien_dau_ra_ac_current', 0).toFixed(1);
        var grid_v = Math.round(getNum('sensor.mini_ems_dbc2511007_dien_ap_luoi_grid_voltage', 230));
        var grid_hz = Math.round(getNum('sensor.mini_ems_dbc2511007_tan_so_luoi_grid_frequency', 50));
        var grid_p = Math.round(getNum('sensor.mini_ems_dbc2511007_luoi_cong_suat_grid_power_mua_ban', 0));
        var grid_curr = getNum('sensor.mini_ems_dbc2511007_dong_dien_luoi_grid_current', 0).toFixed(1);
        var rated_power = getNum('sensor.mini_ems_dbc2511007_cong_suat_dinh_muc_rated_power', 5.0).toFixed(1);
        var current_p = Math.round(getNum('sensor.mini_ems_dbc2511007_cong_suat_hien_tai_current_power', pvTotal));

        // Công suất AC & Tải tiêu thụ
        var load_p = Math.round(getNum('sensor.mini_ems_dbc2511007_tai_tieu_thu_load_power', 0));
        var ac_p = Math.round(getNum('sensor.mini_ems_dbc2511007_ac_cong_suat_dau_ra_ac_output_power', load_p));
        var inv_power = Math.round(getNum('sensor.mini_ems_dbc2511007_bien_tan_cong_suat_inverter_power', ac_p));

        // Phân loại sạc / xả pin
        var batChargeW = bat_w > 3 ? bat_w : 0;
        var batDischargeW = bat_w < -3 ? Math.abs(bat_w) : 0;

        // Phân loại lưới điện EVN
        var gridImport = grid_p > 3 ? grid_p : 0;
        var gridExport = grid_p < -3 ? Math.abs(grid_p) : 0;

        // Tính tải thực tế bằng cân bằng năng lượng:
        // Tải = PV + Pin xả + Mua lưới - Sạc pin - Bán lưới
        var energyBalanceLoad = Math.max(0, Math.round(pvTotal + batDischargeW + gridImport - batChargeW - gridExport));
        var actualHouseLoad = load_p > 5 ? load_p : (ac_p > 5 ? ac_p : (energyBalanceLoad > 0 ? energyBalanceLoad : 0));

        // Trạng thái hệ thống
        var systemStatusEntity = getStr('sensor.mini_ems_dbc2511007_trang_thai_he_thong_system_status', '');
        var inverterStatus = systemStatusEntity || 'SẴN SÀNG';
        var inverterStatusColor = '#34d399';
        if (gridImport > 10) {
          inverterStatus = pvTotal > 10 ? 'SOLAR+LƯỚI' : (batDischargeW > 10 ? 'PIN+LƯỚI' : 'MUA ĐIỆN');
          inverterStatusColor = '#f59e0b';
        } else if (gridExport > 10) {
          inverterStatus = 'HÒA LƯỚI'; inverterStatusColor = '#38bdf8';
        } else if (pvTotal > 10 && batDischargeW > 10) {
          inverterStatus = 'SOLAR+PIN'; inverterStatusColor = '#fbbf24';
        } else if (pvTotal > 10 && batChargeW > 10) {
          inverterStatus = 'SẠC PIN'; inverterStatusColor = '#10b981';
        } else if (pvTotal > 10) {
          inverterStatus = 'MẶT TRỜI'; inverterStatusColor = '#fbbf24';
        } else if (batDischargeW > 10) {
          inverterStatus = 'XẢ PIN'; inverterStatusColor = '#f59e0b';
        } else if (batChargeW > 10) {
          inverterStatus = 'SẠC PIN'; inverterStatusColor = '#34d399';
        }

        // Tỷ lệ tự dùng
        var selfRatio = getNum('sensor.mini_ems_dbc2511007_ty_le_tu_tieu_thu_self_consumption', 0);
        if (selfRatio <= 0 && ac_p > 0) {
          selfRatio = Math.min(100, Math.round((actualHouseLoad / ac_p) * 100));
        }

        // Sản lượng & Thu nhập
        var daily_kwh = getFirstValid([
          'sensor.mini_ems_dbc2511007_san_luong_hom_nay_daily_generation',
          'sensor.mini_ems_dbc2511007_san_luong_hom_nay_bien_tan_daily_kwh'
        ], 0).toFixed(1);

        var total_kwh = Math.round(getFirstValid([
          'sensor.mini_ems_dbc2511007_tong_san_luong_total_generation',
          'sensor.mini_ems_dbc2511007_tong_san_luong_bien_tan_total_kwh'
        ], 0));

        var inv_daily_kwh = getNum('sensor.mini_ems_dbc2511007_san_luong_hom_nay_bien_tan_daily_kwh', parseFloat(daily_kwh)).toFixed(1);
        var inv_total_kwh = Math.round(getNum('sensor.mini_ems_dbc2511007_tong_san_luong_bien_tan_total_kwh', total_kwh));

        var daily_income = getNum('sensor.mini_ems_dbc2511007_thu_nhap_hom_nay_daily_income', 0);
        var total_income = getNum('sensor.mini_ems_dbc2511007_tong_thu_nhap_cumulative_income', 0);
        if (daily_income <= 0 && parseFloat(daily_kwh) > 0) daily_income = Math.round(parseFloat(daily_kwh) * 2380 * 1.08);
        if (total_income <= 0 && total_kwh > 0) total_income = Math.round(total_kwh * 2380 * 1.08);

        // Môi trường xanh
        var co2_saved = getNum('sensor.mini_ems_dbc2511007_giam_phat_thai_co2', Math.round(total_kwh * 0.85));
        var coal_saved = getNum('sensor.mini_ems_dbc2511007_than_tieu_chuan_tiet_kiem_save_coal', Math.round(total_kwh * 0.35));
        var trees_saved = getNum('sensor.mini_ems_dbc2511007_cay_xanh_bao_ve', Math.round(total_kwh * 0.05));
        var inv_count = getNum('sensor.mini_ems_dbc2511007_so_luong_bien_tan', 1);
        var inv_online_count = getNum('sensor.mini_ems_dbc2511007_bien_tan_dang_online', 1);

        // Binary sensors
        var isOnline = states['binary_sensor.mini_ems_dbc2511007_bien_tan_online'] ? (states['binary_sensor.mini_ems_dbc2511007_bien_tan_online'].state === 'on') : true;
        var isBatCharging = states['binary_sensor.mini_ems_dbc2511007_dang_sac_pin'] ? (states['binary_sensor.mini_ems_dbc2511007_dang_sac_pin'].state === 'on') : (batChargeW > 5);
        var isBatDischarging = states['binary_sensor.mini_ems_dbc2511007_dang_xa_pin'] ? (states['binary_sensor.mini_ems_dbc2511007_dang_xa_pin'].state === 'on') : (batDischargeW > 5);
        var isSolarGen = states['binary_sensor.mini_ems_dbc2511007_mat_troi_dang_phat_dien'] ? (states['binary_sensor.mini_ems_dbc2511007_mat_troi_dang_phat_dien'].state === 'on') : (pvTotal > 10);
        var isGridImport = states['binary_sensor.mini_ems_dbc2511007_dang_mua_dien_luoi'] ? (states['binary_sensor.mini_ems_dbc2511007_dang_mua_dien_luoi'].state === 'on') : (gridImport > 5);
        var isGridExport = states['binary_sensor.mini_ems_dbc2511007_dang_ban_dien_luoi_hoa_luoi'] ? (states['binary_sensor.mini_ems_dbc2511007_dang_ban_dien_luoi_hoa_luoi'].state === 'on') : (gridExport > 5);
        var hasFwUpdate = states['binary_sensor.mini_ems_dbc2511007_co_ban_cap_nhat_firmware'] ? (states['binary_sensor.mini_ems_dbc2511007_co_ban_cap_nhat_firmware'].state === 'on') : false;

        // Bảng điều khiển từ xa
        var gridExportState = states['switch.mini_ems_dbc2511007_cho_phep_ban_dien_luoi_grid_export'] ? (states['switch.mini_ems_dbc2511007_cho_phep_ban_dien_luoi_grid_export'].state === 'on') : true;
        var forceChargeState = states['switch.mini_ems_dbc2511007_buoc_sac_pin_tu_luoi_force_charge'] ? (states['switch.mini_ems_dbc2511007_buoc_sac_pin_tu_luoi_force_charge'].state === 'on') : false;
        var workModeVal = getStr('select.mini_ems_dbc2511007_che_do_hoat_dong_work_mode', 'Tự dùng (Self-Consumption)');
        var chargeModeVal = getStr('select.mini_ems_dbc2511007_che_do_sac_pin_charge_mode', 'Tự động (Auto)');
        var maxExportW = getNum('number.mini_ems_dbc2511007_gioi_han_cong_suat_phat_luoi_max_export_power', 5000);
        var maxChargeA = getNum('number.mini_ems_dbc2511007_dong_sac_pin_toi_da_max_charge_current', 50);
        var maxDischargeA = getNum('number.mini_ems_dbc2511007_dong_xa_pin_toi_da_max_discharge_current', 60);
        var minSocVal = getNum('number.mini_ems_dbc2511007_pin_soc_toi_thieu_min_battery_soc', 20);
        var maxSocVal = getNum('number.mini_ems_dbc2511007_pin_soc_toi_da_max_battery_soc', 95);

        // ==========================================
        // 3. SVG VECTORS THỜI GIAN THỰC
        // ==========================================
        var pv1PathSvg = pv1_w > 5
          ? `<path d="M 170 85 C 290 85, 340 230, 420 230" fill="none" stroke="url(#g-pv)" stroke-width="3.5" class="pulse-line-fwd" marker-end="url(#ar-gold)" /><circle cx="412" cy="230" r="4.5" fill="#10b981" />`
          : `<path d="M 170 85 C 290 85, 340 230, 420 230" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2" stroke-dasharray="5,6" opacity="0.4" />`;

        var pv2PathSvg = pv2_w > 5
          ? `<path d="M 170 250 L 420 250" fill="none" stroke="url(#g-pv)" stroke-width="3.5" class="pulse-line-fwd" marker-end="url(#ar-gold)" /><circle cx="412" cy="250" r="4.5" fill="#10b981" />`
          : `<path d="M 170 250 L 420 250" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2" stroke-dasharray="5,6" opacity="0.4" />`;

        var batPathSvg = "";
        if (batChargeW > 5) {
          batPathSvg = `<path d="M 420 270 C 340 270, 290 415, 170 415" fill="none" stroke="url(#g-bat-in)" stroke-width="3.5" class="pulse-line-fwd" marker-end="url(#ar-green)" /><circle cx="178" cy="415" r="4.5" fill="#10b981" />`;
        } else if (batDischargeW > 5) {
          batPathSvg = `<path d="M 170 415 C 290 415, 340 270, 420 270" fill="none" stroke="url(#g-bat-out)" stroke-width="3.5" class="pulse-line-fwd" marker-end="url(#ar-gold)" /><circle cx="412" cy="270" r="4.5" fill="#10b981" />`;
        } else {
          batPathSvg = `<path d="M 170 415 C 290 415, 340 270, 420 270" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2" stroke-dasharray="5,6" opacity="0.4" />`;
        }

        var gridPathSvg = "";
        if (gridImport > 5) {
          gridPathSvg = `<path d="M 710 85 C 590 85, 540 230, 460 230" fill="none" stroke="url(#g-grid-in)" stroke-width="3.5" class="pulse-line-fwd" marker-end="url(#ar-gold)" /><circle cx="468" cy="230" r="4.5" fill="#f59e0b" filter="drop-shadow(0 0 8px #f59e0b)" />`;
        } else if (gridExport > 5) {
          gridPathSvg = `<path d="M 460 230 C 540 230, 590 85, 710 85" fill="none" stroke="url(#g-grid-out)" stroke-width="3.5" class="pulse-line-fwd" marker-end="url(#ar-green)" /><circle cx="702" cy="85" r="4.5" fill="#10b981" />`;
        } else {
          gridPathSvg = `<path d="M 710 85 C 590 85, 540 230, 460 230" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2" stroke-dasharray="5,6" opacity="0.4" />`;
        }

        var isAnyPowerFlowing = pvTotal > 5 || batDischargeW > 3 || gridImport > 3;
        var housePathSvg = (actualHouseLoad > 3 || isAnyPowerFlowing)
          ? `<path d="M 460 270 C 540 270, 590 415, 710 415" fill="none" stroke="url(#g-house)" stroke-width="3.5" class="pulse-line-fwd" marker-end="url(#ar-cyan)" /><circle cx="702" cy="415" r="5" fill="#00f2fe" filter="drop-shadow(0 0 10px #00f2fe)" />`
          : `<path d="M 460 270 C 540 270, 590 415, 710 415" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2" stroke-dasharray="5,6" opacity="0.4" />`;

        var displayBatW = batChargeW > 0 ? batChargeW : (batDischargeW > 0 ? -batDischargeW : 0);
        var batTextColor = displayBatW > 0 ? '#34d399' : (displayBatW < 0 ? '#fbbf24' : '#94a3b8');
        var gridTextColor = gridImport > 5 ? '#f59e0b' : (gridExport > 5 ? '#34d399' : '#94a3b8');
        var gridVal = gridImport > 0 ? gridImport : gridExport;

        return `
          <style>
            * { box-sizing: border-box; }
            .pulse-line-fwd { stroke-dasharray: 8, 8; animation: lineMoveForward 1.2s linear infinite; }
            @keyframes lineMoveForward { to { stroke-dashoffset: -32; } }
            .glass-panel {
              background: rgba(15, 23, 42, 0.85);
              border: 1px solid rgba(255, 255, 255, 0.08);
              border-radius: clamp(14px, 2vw, 20px);
              padding: clamp(10px, 1.8vw, 16px);
              box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
              width: 100%;
              overflow: hidden;
            }
            .kpi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(8px, 1.5vw, 12px); margin-bottom: 12px; }
            .middle-flex { display: flex; flex-direction: column; gap: 12px; margin-bottom: 12px; }
            .dual-grid { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(8px, 1.5vw, 12px); margin-bottom: 12px; }
            @media (min-width: 768px) {
              .middle-flex { display: grid !important; grid-template-columns: 1.35fr 1fr !important; align-items: stretch !important; }
            }
            @media (min-width: 1024px) {
              .kpi-grid { grid-template-columns: repeat(4, 1fr) !important; }
            }
            .step-btn {
              background: rgba(255,255,255,0.08);
              border: 1px solid rgba(255,255,255,0.18);
              color: #fff;
              width: 28px;
              height: 28px;
              border-radius: 6px;
              cursor: pointer;
              font-size: 16px;
              font-weight: 900;
              line-height: 1;
              display: flex;
              align-items: center;
              justify-content: center;
              transition: all 0.15s;
              user-select: none;
            }
            .step-btn:hover {
              background: rgba(255,255,255,0.22);
              border-color: rgba(255,255,255,0.4);
              transform: scale(1.05);
            }
            .step-btn:active {
              transform: scale(0.95);
            }
            .mode-pill {
              flex: 1;
              min-width: 100px;
              padding: 7px 10px;
              border-radius: 8px;
              font-size: 11px;
              font-weight: 800;
              text-align: center;
              cursor: pointer;
              transition: all 0.2s;
              user-select: none;
              border: 1px solid rgba(255,255,255,0.08);
              background: rgba(255,255,255,0.04);
              color: #94a3b8;
            }
            .mode-pill:hover {
              background: rgba(255,255,255,0.08);
              color: #fff;
            }
            .mode-pill.active-blue {
              background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
              border-color: #38bdf8;
              color: #fff;
              box-shadow: 0 0 10px rgba(56,189,248,0.4);
            }
            .mode-pill.active-green {
              background: linear-gradient(135deg, #059669 0%, #047857 100%);
              border-color: #34d399;
              color: #fff;
              box-shadow: 0 0 10px rgba(52,211,153,0.4);
            }
            .entity-table {
              width: 100%;
              border-collapse: collapse;
              font-size: 11px;
            }
            .entity-table th {
              background: rgba(255,255,255,0.05);
              padding: 8px 10px;
              text-align: left;
              color: #94a3b8;
              font-weight: 700;
              border-bottom: 1px solid rgba(255,255,255,0.1);
            }
            .entity-table td {
              padding: 7px 10px;
              border-bottom: 1px solid rgba(255,255,255,0.04);
              color: #cbd5e1;
            }
            .entity-table tr:hover td {
              background: rgba(255,255,255,0.03);
              cursor: pointer;
            }
            .val-badge {
              font-weight: 800;
              padding: 2px 7px;
              border-radius: 5px;
              display: inline-block;
            }
          </style>

          <div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; width: 100%; color: #fff;">
            
            <!-- HEADER -->
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 8px;">
              <div style="display: flex; align-items: center; gap: 10px;">
                <div style="background: linear-gradient(135deg, #10b981 0%, #06b6d4 100%); width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(16,185,129,0.35);">
                  <ha-icon icon="mdi:solar-power" style="color: #fff; --mdc-icon-size: 24px;"></ha-icon>
                </div>
                <div>
                  <div style="font-size: 14.5px; font-weight: 800; letter-spacing: 0.5px; display: flex; align-items: center; gap: 6px;">
                    NHÀ CỦA LÂM
                    <span style="font-size: 9px; padding: 2px 6px; border-radius: 4px; background: rgba(16,185,129,0.2); color: #34d399; font-weight: 800;">DBC2511007</span>
                    ${hasFwUpdate ? '<span style="font-size: 8.5px; padding: 1px 5px; border-radius: 4px; background: rgba(239,68,68,0.2); color: #f87171; font-weight: 700;">UPDATE FW</span>' : ''}
                  </div>
                  <div style="font-size: 11px; color: #94a3b8; display: flex; align-items: center; gap: 6px;">
                    <span style="display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: ${isOnline ? '#10b981' : '#ef4444'}; box-shadow: 0 0 6px ${isOnline ? '#10b981' : '#ef4444'};"></span>
                    <span>${isOnline ? 'Đang hoạt động (Online Cloud)' : 'Ngoại tuyến'}</span>
                    <span>•</span>
                    <span style="color: #38bdf8;">Donnergy Hybrid 5kW</span>
                  </div>
                </div>
              </div>

              <!-- THỜI TIẾT TẠI TRẠM -->
              <div style="background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; padding: 5px 10px; display: flex; align-items: center; gap: 10px; font-size: 11px;">
                <ha-icon icon="${weatherIcon}" style="color: ${weatherIconColor}; --mdc-icon-size: 20px;"></ha-icon>
                <div>
                  <div style="font-weight: 700; color: #fff;">${weatherTemp}°C • ${weatherDesc}</div>
                  <div style="color: #94a3b8; font-size: 9.5px;">Ẩm ${weatherHumi}% • Gió ${weatherWind} km/h</div>
                </div>
              </div>
            </div>

            <!-- KPI TỔNG QUAN -->
            <div class="kpi-grid">
              <!-- Sản lượng hôm nay -->
              <div class="glass-panel" style="border-left: 4px solid #10b981;">
                <div style="font-size: 10px; font-weight: 700; color: #94a3b8; text-transform: uppercase;">SẢN LƯỢNG HÔM NAY</div>
                <div style="font-size: 24px; font-weight: 900; color: #10b981; margin: 4px 0 2px 0;">
                  ${daily_kwh} <span style="font-size: 13px; font-weight: 700; color: #94a3b8;">kWh</span>
                </div>
                <div style="font-size: 10px; color: #94a3b8;">Thu nhập: <b style="color: #34d399;">${formatVND(daily_income)} đ</b></div>
              </div>

              <!-- Tổng sản lượng -->
              <div class="glass-panel" style="border-left: 4px solid #06b6d4;">
                <div style="font-size: 10px; font-weight: 700; color: #94a3b8; text-transform: uppercase;">TỔNG SẢN LƯỢNG</div>
                <div style="font-size: 24px; font-weight: 900; color: #06b6d4; margin: 4px 0 2px 0;">
                  ${total_kwh} <span style="font-size: 13px; font-weight: 700; color: #94a3b8;">kWh</span>
                </div>
                <div style="font-size: 10px; color: #94a3b8;">Tổng tiền: <b style="color: #38bdf8;">${formatVND(total_income)} đ</b></div>
              </div>

              <!-- Môi trường xanh -->
              <div class="glass-panel" style="border-left: 4px solid #3b82f6;">
                <div style="font-size: 10px; font-weight: 700; color: #94a3b8; text-transform: uppercase;">GIẢM PHÁT THẢI CO2</div>
                <div style="font-size: 24px; font-weight: 900; color: #60a5fa; margin: 4px 0 2px 0;">
                  ${co2_saved} <span style="font-size: 13px; font-weight: 700; color: #94a3b8;">kg</span>
                </div>
                <div style="font-size: 10px; color: #94a3b8;">Tương đương: <b style="color: #60a5fa;">${trees_saved} cây xanh</b></div>
              </div>

              <!-- Tỷ lệ tự dùng & Than -->
              <div class="glass-panel" style="border-left: 4px solid #f59e0b;">
                <div style="font-size: 10px; font-weight: 700; color: #94a3b8; text-transform: uppercase;">TỰ TIÊU THỤ</div>
                <div style="font-size: 24px; font-weight: 900; color: #fbbf24; margin: 4px 0 2px 0;">
                  ${selfRatio}%
                </div>
                <div style="font-size: 10px; color: #94a3b8;">Tiết kiệm: <b style="color: #fbbf24;">${coal_saved} kg than</b></div>
              </div>
            </div>

            <!-- SVG SƠ ĐỒ NĂNG LƯỢNG & PHỤ TẢI -->
            <div class="middle-flex">
              <!-- Sơ đồ SVG -->
              <div class="glass-panel" style="padding: 12px; display: flex; flex-direction: column; justify-content: space-between;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                  <div style="display: flex; align-items: center; gap: 6px;">
                    <ha-icon icon="mdi:vector-polyline" style="color: #10b981; --mdc-icon-size: 18px;"></ha-icon>
                    <span style="font-size: 12px; font-weight: 800; color: #fff; text-transform: uppercase;">DÒNG CHẢY NĂNG LƯỢNG THỰC TẾ</span>
                  </div>
                  <span style="font-size: 10px; color: ${solarEvalColor}; font-weight: 700;">${solarEval} (${sunElev}°)</span>
                </div>

                <div style="width: 100%; position: relative;">
                  <svg viewBox="0 0 880 480" style="width: 100%; height: auto; overflow: visible;">
                    <defs>
                      <linearGradient id="g-pv" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#fbbf24" /><stop offset="100%" stop-color="#10b981" />
                      </linearGradient>
                      <linearGradient id="g-bat-in" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#10b981" /><stop offset="100%" stop-color="#34d399" />
                      </linearGradient>
                      <linearGradient id="g-bat-out" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#34d399" /><stop offset="100%" stop-color="#fbbf24" />
                      </linearGradient>
                      <linearGradient id="g-grid-in" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#f59e0b" /><stop offset="100%" stop-color="#fbbf24" />
                      </linearGradient>
                      <linearGradient id="g-grid-out" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#10b981" /><stop offset="100%" stop-color="#34d399" />
                      </linearGradient>
                      <linearGradient id="g-house" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#06b6d4" /><stop offset="100%" stop-color="#00f2fe" />
                      </linearGradient>
                      <marker id="ar-gold" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><polygon points="0 0, 6 3, 0 6" fill="#fbbf24" /></marker>
                      <marker id="ar-green" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><polygon points="0 0, 6 3, 0 6" fill="#10b981" /></marker>
                      <marker id="ar-cyan" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><polygon points="0 0, 6 3, 0 6" fill="#00f2fe" /></marker>
                    </defs>

                    <!-- DÂY DẪN NĂNG LƯỢNG -->
                    ${pv1PathSvg}
                    ${pv2PathSvg}
                    ${batPathSvg}
                    ${gridPathSvg}
                    ${housePathSvg}

                    <!-- BIẾN TẦN TRUNG TÂM -->
                    <g transform="translate(440, 250)">
                      <circle cx="0" cy="0" r="54" fill="rgba(15,23,42,0.95)" stroke="${inverterStatusColor}" stroke-width="2.5" filter="drop-shadow(0 0 18px ${inverterStatusColor}66)" />
                      <!-- Label BIẾN TẦN trên -->
                      <text x="0" y="-35" text-anchor="middle" fill="#94a3b8" font-size="10" font-weight="700">BIẾN TẦN</text>
                      <!-- Icon sóng sin -->
                      <path d="M -20 -6 C -10 -20, 10 8, 20 -6 M -20 6 C -10 -8, 10 20, 20 6" fill="none" stroke="${inverterStatusColor}" stroke-width="2.5" stroke-linecap="round" />
                      <!-- Badge trạng thái dưới - chữ TO, màu động -->
                      <rect x="-52" y="60" width="104" height="32" rx="10" fill="rgba(0,0,0,0.75)" stroke="${inverterStatusColor}" stroke-width="1.5" />
                      <text x="0" y="82" text-anchor="middle" fill="${inverterStatusColor}" font-size="15" font-weight="900" letter-spacing="0.5">${inverterStatus}</text>
                    </g>

                    <!-- PV1 QUANG ĐIỆN -->
                    <g transform="translate(110, 60)">
                      <!-- Nền panel -->
                      <rect x="-36" y="-32" width="72" height="56" rx="14" fill="rgba(251,191,36,0.15)" stroke="#fbbf24" stroke-width="1.5" />
                      <!-- Icon tấm pin mặt trời (chia ô) -->
                      <rect x="-22" y="-20" width="18" height="14" rx="2" fill="none" stroke="#fbbf24" stroke-width="1.5" />
                      <rect x="4" y="-20" width="18" height="14" rx="2" fill="none" stroke="#fbbf24" stroke-width="1.5" />
                      <rect x="-22" y="-3" width="18" height="14" rx="2" fill="none" stroke="#fbbf24" stroke-width="1.5" />
                      <rect x="4" y="-3" width="18" height="14" rx="2" fill="none" stroke="#fbbf24" stroke-width="1.5" />
                      <!-- Nhãn PV1 -->
                      <text x="0" y="38" text-anchor="middle" fill="#94a3b8" font-size="9" font-weight="700">PV1</text>
                      <!-- Giá trị W -->
                      <rect x="-42" y="44" width="84" height="26" rx="10" fill="rgba(15,23,42,0.9)" stroke="rgba(251,191,36,0.4)" stroke-width="1.2" />
                      <text x="0" y="62" text-anchor="middle" fill="#fbbf24" font-size="14" font-weight="900">${pv1_w} W</text>
                    </g>

                    <!-- PV2 QUANG ĐIỆN -->
                    <g transform="translate(110, 225)">
                      <rect x="-36" y="-32" width="72" height="56" rx="14" fill="rgba(251,191,36,0.15)" stroke="#fbbf24" stroke-width="1.5" />
                      <rect x="-22" y="-20" width="18" height="14" rx="2" fill="none" stroke="#fbbf24" stroke-width="1.5" />
                      <rect x="4" y="-20" width="18" height="14" rx="2" fill="none" stroke="#fbbf24" stroke-width="1.5" />
                      <rect x="-22" y="-3" width="18" height="14" rx="2" fill="none" stroke="#fbbf24" stroke-width="1.5" />
                      <rect x="4" y="-3" width="18" height="14" rx="2" fill="none" stroke="#fbbf24" stroke-width="1.5" />
                      <text x="0" y="38" text-anchor="middle" fill="#94a3b8" font-size="9" font-weight="700">PV2</text>
                      <rect x="-42" y="44" width="84" height="26" rx="10" fill="rgba(15,23,42,0.9)" stroke="rgba(251,191,36,0.4)" stroke-width="1.2" />
                      <text x="0" y="62" text-anchor="middle" fill="#fbbf24" font-size="14" font-weight="900">${pv2_w} W</text>
                    </g>

                    <!-- PIN BMS -->
                    <g transform="translate(110, 390)">
                      <!-- Nền pin -->
                      <rect x="-36" y="-34" width="72" height="60" rx="14" fill="rgba(16,185,129,0.15)" stroke="${batTextColor}" stroke-width="1.5" />
                      <!-- Icon pin BMS với thanh fill SOC -->
                      <rect x="-16" y="-26" width="32" height="40" rx="4" fill="none" stroke="#34d399" stroke-width="2" />
                      <rect x="-6" y="-30" width="12" height="5" rx="2" fill="#34d399" />
                      <!-- Fill pin theo SOC -->
                      <rect x="-13" y="${-22 + (36 * (1 - bat_soc / 100))}" width="26" height="${36 * bat_soc / 100}" rx="2" fill="${batTextColor}" opacity="0.7" />
                      <!-- Nhãn PIN -->
                      <text x="0" y="40" text-anchor="middle" fill="#94a3b8" font-size="9" font-weight="700">PIN ${bat_soc}%</text>
                      <!-- Giá trị W -->
                      <rect x="-55" y="46" width="110" height="26" rx="10" fill="rgba(15,23,42,0.9)" stroke="rgba(52,211,153,0.4)" stroke-width="1.2" />
                      <text x="0" y="64" text-anchor="middle" fill="${batTextColor}" font-size="13" font-weight="900">${displayBatW > 0 ? '+' : ''}${displayBatW} W</text>
                    </g>

                    <!-- LƯỚI EVN -->
                    <g transform="translate(770, 60)">
                      <rect x="-40" y="-34" width="80" height="60" rx="14" fill="rgba(255,255,255,0.05)" stroke="${gridTextColor}" stroke-width="1.5" />
                      <!-- Icon cột điện: cột + dây -->
                      <line x1="0" y1="-26" x2="0" y2="18" stroke="${gridTextColor}" stroke-width="2.5" />
                      <line x1="-18" y1="-14" x2="18" y2="-14" stroke="${gridTextColor}" stroke-width="2" />
                      <line x1="-18" y1="-14" x2="-24" y2="-4" stroke="${gridTextColor}" stroke-width="1.5" />
                      <line x1="18" y1="-14" x2="24" y2="-4" stroke="${gridTextColor}" stroke-width="1.5" />
                      <circle cx="-18" cy="-14" r="3" fill="${gridTextColor}" />
                      <circle cx="18" cy="-14" r="3" fill="${gridTextColor}" />
                      <!-- Nhãn -->
                      <text x="0" y="38" text-anchor="middle" fill="#94a3b8" font-size="9" font-weight="700">LƯỚI EVN</text>
                      <rect x="-42" y="44" width="84" height="26" rx="10" fill="rgba(15,23,42,0.9)" stroke="rgba(255,255,255,0.15)" stroke-width="1.2" />
