                      <rect x="-42" y="-36" width="84" height="68" rx="14" fill="rgba(0,242,254,0.18)" stroke="#00f2fe" stroke-width="2" filter="drop-shadow(0 0 15px rgba(0,242,254,0.4))" />
                      <!-- Icon ngôi nhà -->
                      <path d="M 0 -24 L -20 -8 L -20 12 L 20 12 L 20 -8 Z" fill="none" stroke="#00f2fe" stroke-width="2" stroke-linejoin="round" />
                      <rect x="-6" y="-2" width="12" height="14" rx="2" fill="#00f2fe" opacity="0.6" />
