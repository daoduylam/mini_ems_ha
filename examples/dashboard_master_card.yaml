                      <text x="0" y="57" text-anchor="middle" fill="#00f2fe" font-size="17" font-weight="900">${actualHouseLoad} W</text>
                    </g>
                  </svg>
                </div>

                <!-- PV1 & PV2 bar -->
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px;">
                  <div style="background: rgba(255,255,255,0.03); border: 1px solid rgba(16,185,129,0.25); border-radius: 10px; padding: 6px 10px; display: flex; justify-content: space-between; align-items: center;">
                    <span style="font-size: 11px; font-weight: 800; color: #34d399;">PV1: <b style="color: #fbbf24;">${pv1_w} W</b></span>
                    <span style="font-size: 10px; color: #94a3b8;">${pv1_v}V • ${pv1_a}A</span>
                  </div>
                  <div style="background: rgba(255,255,255,0.03); border: 1px solid rgba(16,185,129,0.25); border-radius: 10px; padding: 6px 10px; display: flex; justify-content: space-between; align-items: center;">
                    <span style="font-size: 11px; font-weight: 800; color: #34d399;">PV2: <b style="color: #fbbf24;">${pv2_w} W</b></span>
                    <span style="font-size: 10px; color: #94a3b8;">${pv2_v}V • ${pv2_a}A</span>
                  </div>
                </div>
              </div>

              <!-- Phụ tải & Môi trường -->
              <div style="display: flex; flex-direction: column; gap: 12px;">
                <!-- Phụ tải -->
                <div class="glass-panel" style="border-left: 4px solid #00f2fe; padding: 12px;">
                  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                    <span style="font-size: 11px; font-weight: 800; color: #00f2fe; text-transform: uppercase;">PHÂN BỔ PHỤ TẢI (LOAD POWER)</span>
                    <span style="font-size: 11px; font-weight: 800; background: rgba(0,242,254,0.15); color: #00f2fe; padding: 3px 8px; border-radius: 6px;">
                      AC: ${ac_p} W
                    </span>
                  </div>

                  <div style="display: grid; grid-template-columns: ${batChargeW > 5 ? '1fr 1fr 1fr' : '1fr 1fr'}; gap: 8px; margin-bottom: 10px;">
                    <div style="background: rgba(0,242,254,0.08); border-radius: 10px; padding: 8px;">
                      <div style="font-size: 10px; color: #94a3b8; font-weight: 700;">TẢI NHÀ DÙNG</div>
                      <div style="font-size: 20px; font-weight: 900; color: #fff; margin-top: 2px;">${actualHouseLoad} <span style="font-size: 11px; color: #00f2fe;">W</span></div>
                    </div>
                    <div style="background: rgba(245,158,11,0.08); border-radius: 10px; padding: 8px;">
                      <div style="font-size: 10px; color: #94a3b8; font-weight: 700;">LƯỚI MUA VÀO</div>
                      <div style="font-size: 20px; font-weight: 900; color: #f59e0b; margin-top: 2px;">${gridImport} <span style="font-size: 11px; color: #94a3b8;">W</span></div>
                    </div>
                    ${batChargeW > 5 ? `
                    <div style="background: rgba(16,185,129,0.08); border-radius: 10px; padding: 8px;">
                      <div style="font-size: 10px; color: #94a3b8; font-weight: 700;">SẠC VÀO PIN</div>
                      <div style="font-size: 20px; font-weight: 900; color: #10b981; margin-top: 2px;">${batChargeW} <span style="font-size: 11px; color: #94a3b8;">W</span></div>
                    </div>` : ''}
                  </div>

                  <!-- Tự chủ năng lượng -->
                  <div style="background: rgba(255,255,255,0.03); border-radius: 8px; padding: 8px 10px;">
                    <div style="display: flex; justify-content: space-between; font-size: 10.5px; margin-bottom: 4px;">
                      <span style="color: #94a3b8;">Tự cấp năng lượng:</span>
                      <span style="font-weight: 800; color: #34d399;">${actualHouseLoad > 0 ? Math.min(100, Math.round(((actualHouseLoad - gridImport) / actualHouseLoad) * 100)) : 100}%</span>
                    </div>
                    <div style="width: 100%; height: 6px; border-radius: 3px; background: rgba(255,255,255,0.1); overflow: hidden;">
                      <div style="width: ${actualHouseLoad > 0 ? Math.min(100, Math.round(((actualHouseLoad - gridImport) / actualHouseLoad) * 100)) : 100}%; background: linear-gradient(90deg, #10b981, #06b6d4); height: 100%;"></div>
                    </div>
                  </div>
                </div>

                <!-- Thống kê chu kỳ mặt trời & môi trường -->
                <div class="glass-panel" style="padding: 12px; flex: 1; display: flex; flex-direction: column; justify-content: space-between;">
                  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                    <span style="font-size: 11px; font-weight: 800; color: #fbbf24; text-transform: uppercase;">CHU KỲ BỨC XẠ MẶT TRỜI</span>
                    <span style="font-size: 10px; color: #94a3b8;">Hôm nay</span>
                  </div>
                  <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px;">
                    <div style="background: rgba(251,191,36,0.08); border-radius: 8px; padding: 6px 10px; display: flex; align-items: center; gap: 8px;">
                      <ha-icon icon="mdi:weather-sunset-up" style="color: #fbbf24; --mdc-icon-size: 20px;"></ha-icon>
                      <div>
                        <div style="font-size: 9px; color: #94a3b8;">BÌNH MINH</div>
                        <div style="font-size: 12px; font-weight: 800; color: #fff;">${sunriseTime}</div>
                      </div>
                    </div>
                    <div style="background: rgba(245,158,11,0.08); border-radius: 8px; padding: 6px 10px; display: flex; align-items: center; gap: 8px;">
                      <ha-icon icon="mdi:weather-sunset-down" style="color: #f59e0b; --mdc-icon-size: 20px;"></ha-icon>
                      <div>
                        <div style="font-size: 9px; color: #94a3b8;">HOÀNG HÔN</div>
                        <div style="font-size: 12px; font-weight: 800; color: #fff;">${sunsetTime}</div>
                      </div>
                    </div>
                  </div>
                  <div style="background: rgba(255,255,255,0.03); border-radius: 8px; padding: 6px 10px; display: flex; justify-content: space-between; font-size: 10.5px;">
                    <span style="color: #94a3b8;">Góc bức xạ mặt trời:</span>
                    <span style="font-weight: 800; color: ${solarEvalColor};">${sunElev}° (${solarEval})</span>
                  </div>
                </div>
              </div>
            </div>

            <!-- BIẾN TẦN & PIN BMS -->
            <div class="dual-grid" style="margin-bottom: 12px;">
