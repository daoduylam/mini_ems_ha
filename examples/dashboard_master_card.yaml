                <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; text-align: center; margin-bottom: 8px;">
                  <div style="background: rgba(255,255,255,0.03); border-radius: 6px; padding: 6px 2px;">
                    <div style="font-size: 9px; color: #94a3b8;">ĐIỆN ÁP</div>
                    <div style="font-size: 13px; font-weight: 800; color: #fff;">${bat_v} V</div>
                  </div>
                  <div style="background: rgba(255,255,255,0.03); border-radius: 6px; padding: 6px 2px;">
                    <div style="font-size: 9px; color: #94a3b8;">DÒNG</div>
                    <div style="font-size: 13px; font-weight: 800; color: ${batTextColor};">${bat_a} A</div>
                  </div>
                  <div style="background: rgba(255,255,255,0.03); border-radius: 6px; padding: 6px 2px;">
                    <div style="font-size: 9px; color: #94a3b8;">CÔNG SUẤT</div>
                    <div style="font-size: 13px; font-weight: 800; color: ${batTextColor};">${displayBatW} W</div>
                  </div>
                </div>
                <div style="background: rgba(0,0,0,0.3); border-radius: 8px; padding: 6px 10px; margin-bottom: 6px;">
                  <div style="display: flex; justify-content: space-between; font-size: 10.5px; margin-bottom: 4px;">
                    <span style="color: #94a3b8;">Dung lượng:</span>
                    <span><b style="color: #34d399;">${bat_remain_kwh} kWh</b> / ${bat_total_kwh} kWh</span>
                  </div>
                  <div style="width: 100%; height: 5px; border-radius: 3px; background: rgba(255,255,255,0.1); overflow: hidden;">
                    <div style="width: ${bat_soc}%; background: linear-gradient(90deg, #10b981, #34d399); height: 100%;"></div>
                  </div>
                </div>
                <div style="display: flex; justify-content: space-between; font-size: 10px; color: #94a3b8; padding: 0 4px;">
                  <span>Độ lệch: <b style="color: #38bdf8;">${bat_delta} V</b></span>
                  <span>Chu kỳ: <b style="color: #fff;">${bat_cycles}</b></span>
                  <span>Nhiệt độ: <b style="color: #34d399;">${bat_temp}°C</b></span>
                </div>
              </div>
            </div>

            <!-- BẢNG ĐIỀU KHIỂN TẬP TRUNG (MINI EMS CHUẨN) -->
            <div class="glass-panel" style="border-top: 3px solid #06b6d4; padding: 12px; margin-bottom: 0;">
              <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <div style="display: flex; align-items: center; gap: 6px;">
                  <ha-icon icon="mdi:tune-vertical" style="color: #06b6d4; --mdc-icon-size: 18px;"></ha-icon>
                  <span style="font-size: 12px; font-weight: 800; color: #fff; text-transform: uppercase;">BẢNG ĐIỀU KHIỂN TẬP TRUNG (MINI EMS)</span>
                </div>
                <span style="font-size: 10px; color: #06b6d4; font-weight: 700;">Remote Control</span>
              </div>

              <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 8px;">
                <!-- Bán điện -->
                <div style="background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); border-radius: 10px; padding: 8px 10px; display: flex; justify-content: space-between; align-items: center;">
                  <div style="display: flex; align-items: center; gap: 8px;">
                    <ha-icon icon="mdi:transmission-tower-export" style="color: ${gridExportState ? '#10b981' : '#64748b'}; --mdc-icon-size: 18px;"></ha-icon>
                    <span style="font-size: 11px; font-weight: 700;">Bán điện lưới</span>
                  </div>
                  <span style="font-size: 11px; font-weight: 800; color: ${gridExportState ? '#34d399' : '#94a3b8'}; background: rgba(255,255,255,0.05); padding: 2px 8px; border-radius: 6px;">
                    ${gridExportState ? 'BẬT' : 'TẮT'}
                  </span>
                </div>

                <!-- Buộc sạc -->
                <div style="background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); border-radius: 10px; padding: 8px 10px; display: flex; justify-content: space-between; align-items: center;">
                  <div style="display: flex; align-items: center; gap: 8px;">
                    <ha-icon icon="mdi:battery-charging-high" style="color: ${forceChargeState ? '#fbbf24' : '#64748b'}; --mdc-icon-size: 18px;"></ha-icon>
                    <span style="font-size: 11px; font-weight: 700;">Buộc sạc lưới</span>
                  </div>
                  <span style="font-size: 11px; font-weight: 800; color: ${forceChargeState ? '#fbbf24' : '#94a3b8'}; background: rgba(255,255,255,0.05); padding: 2px 8px; border-radius: 6px;">
                    ${forceChargeState ? 'BẬT' : 'TẮT'}
                  </span>
                </div>

                <!-- Dropdown chế độ -->
                <div style="background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); border-radius: 10px; padding: 8px 10px; display: flex; justify-content: space-between; align-items: center;">
                  <span style="font-size: 11px; color: #94a3b8;">Chế độ hoạt động:</span>
                  <span style="font-size: 11px; font-weight: 800; color: #38bdf8;">${workModeVal.split(' ')[0]}</span>
                </div>

                <div style="background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); border-radius: 10px; padding: 8px 10px; display: flex; justify-content: space-between; align-items: center;">
                  <span style="font-size: 11px; color: #94a3b8;">Chế độ sạc:</span>
                  <span style="font-size: 11px; font-weight: 800; color: #34d399;">${chargeModeVal.split(' ')[0]}</span>
                </div>
              </div>

              <!-- Thanh tóm tắt -->
              <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-top: 8px; text-align: center; font-size: 10.5px;">
                <div style="background: rgba(0,0,0,0.25); padding: 5px; border-radius: 6px;">
                  <span style="color: #94a3b8;">Giới hạn phát:</span> <b style="color: #38bdf8;">${maxExportW} W</b>
                </div>
                <div style="background: rgba(0,0,0,0.25); padding: 5px; border-radius: 6px;">
                  <span style="color: #94a3b8;">Dòng sạc max:</span> <b style="color: #34d399;">${maxChargeA} A</b>
                </div>
                <div style="background: rgba(0,0,0,0.25); padding: 5px; border-radius: 6px;">
                  <span style="color: #94a3b8;">Dòng xả max:</span> <b style="color: #fbbf24;">${maxDischargeA} A</b>
                </div>
              </div>
            </div>

          </div>
        `;
      } catch (e) {
        return `<div style="padding: 16px; color: #f87171;">Lỗi tải dữ liệu: ` + e.message + `</div>`;
      }
    ]]]
